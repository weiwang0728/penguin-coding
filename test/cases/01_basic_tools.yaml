# ═══════════════════════════════════════════════════════════════════
# 01 — 基础工具操作测试案例
# 覆盖: read_file, write_file, edit_file, run_command,
#        search_files, list_directory, 路径安全
# ═══════════════════════════════════════════════════════════════════

- id: "BT-001"
  name: "创建并运行 Python 算法模块"
  description: |
    请在 workspace/ 下创建一个 binary_search.py 文件，实现二分查找算法。
    要求：
    1. 函数签名：def binary_search(arr: list[int], target: int) -> int
    2. 找到返回索引，未找到返回 -1
    3. 包含类型注解和 docstring
    4. 在文件底部添加 __main__ 测试代码，覆盖：空列表、单元素、首尾元素、不存在元素、重复元素
    创建完成后运行该文件验证所有测试通过。
  features:
    - write_file
    - run_command
  category: basic_tools
  difficulty: easy
  expected_behavior: |
    1. agent 使用 write_file 创建 binary_search.py
    2. 使用 run_command 执行 python binary_search.py
    3. 报告所有测试通过
  verification:
    - "workspace/binary_search.py 文件存在"
    - "文件包含 def binary_search 函数定义"
    - "文件包含 if __name__ == '__main__' 测试块"
    - "运行输出包含 'All tests passed' 或类似成功信息"
  edge_cases: []

- id: "BT-002"
  name: "读取现有代码并总结"
  description: |
    请阅读 workspace/src/agent_loop.py 文件，给出以下总结：
    1. 核心流程的 5 个步骤
    2. 使用了哪些工具和参数
    3. 错误处理策略
  features:
    - read_file
  category: basic_tools
  difficulty: easy
  expected_behavior: |
    1. agent 使用 read_file 读取 agent_loop.py
    2. 给出结构化总结，包含核心步骤、工具使用、错误处理
  verification:
    - "agent 成功读取文件内容"
    - "总结提及流式处理/API 调用/工具执行等核心概念"
    - "总结提及错误处理/重试机制"
  edge_cases:
    - "大文件处理：agent_loop.py 超过 500 行，应正确处理"

- id: "BT-003"
  name: "搜索并定位代码模式"
  description: |
    请在项目中搜索所有使用了 "PermissionLevel" 的文件，列出每个文件中该符号的用途。
    然后列出 workspace/src/ 目录下的所有文件。
  features:
    - search_files
    - list_directory
  category: basic_tools
  difficulty: easy
  expected_behavior: |
    1. agent 使用 search_files 搜索 "PermissionLevel"
    2. 找到至少 2 个文件（permissions.py, permissions_config.py 等）
    3. 使用 list_directory 列出 workspace/src/ 内容
    4. 给出每个文件中 PermissionLevel 的用途说明
  verification:
    - "搜索结果包含 permissions 相关文件"
    - "目录列表包含 src/ 下的多个 .py 文件"
    - "每个文件的用途说明合理"
  edge_cases: []

- id: "BT-004"
  name: "精确编辑现有文件"
  description: |
    请完成以下步骤：
    1. 读取 workspace/binary_search.py 文件
    2. 将二分查找改为「左闭右开」区间的实现方式（即 [left, right) 而非 [left, right]）
    3. 同时更新 docstring 说明区间约定
    4. 运行测试确保修改后仍然通过
  features:
    - read_file
    - edit_file
    - run_command
  category: basic_tools
  difficulty: medium
  expected_behavior: |
    1. agent 读取文件内容
    2. 使用 edit_file 精确替换循环条件和 docstring
    3. 运行测试验证功能正确
  verification:
    - "edit_file 成功执行，diff 显示修改内容"
    - "修改后 while 条件变为 left < right（左闭右开）"
    - "docstring 更新提及区间约定"
    - "测试仍然全部通过"
  edge_cases:
    - "编辑不存在的行：应返回错误而非静默失败"

- id: "BT-005"
  name: "多文件创建与批量验证"
  description: |
    请创建一个简单的 Python 包结构：
    1. workspace/mymath/__init__.py — 导出 add, subtract, multiply
    2. workspace/mymath/operations.py — 实现 add, subtract, multiply 三个函数
    3. workspace/mymath/test_operations.py — 使用 assert 编写单元测试
    创建完成后运行测试文件验证。
  features:
    - write_file
    - run_command
    - list_directory
  category: basic_tools
  difficulty: medium
  expected_behavior: |
    1. agent 连续创建 3 个文件
    2. 使用 run_command 运行测试
    3. 可选使用 list_directory 确认文件结构
  verification:
    - "workspace/mymath/__init__.py 存在且包含导出"
    - "workspace/mymath/operations.py 包含 3 个函数"
    - "workspace/mymath/test_operations.py 包含测试用例"
    - "python -m mymath.test_operations 运行通过"
  edge_cases: []

- id: "BT-006"
  name: "路径安全与错误恢复"
  description: |
    请依次尝试以下操作并报告每个操作的结果：
    1. 写入文件到 /tmp/outside.py，内容为 "should not work"
    2. 写入文件到 workspace/inside.py，内容为 "should work"
    3. 读取 /etc/passwd 文件
    4. 搜索 workspace/ 下包含 "should work" 的文件
    5. 列出 workspace/mymath/ 目录内容
  features:
    - write_file
    - read_file
    - search_files
    - list_directory
    - path_security
  category: basic_tools
  difficulty: medium
  expected_behavior: |
    1. /tmp/outside.py 写入被拒绝（路径超出允许目录）
    2. workspace/inside.py 写入成功
    3. /etc/passwd 读取被拒绝（路径超出允许目录）
    4. 搜索找到 inside.py
    5. 目录列表正常显示
  verification:
    - "步骤 1 返回路径校验错误"
    - "步骤 2 文件成功创建"
    - "步骤 3 返回路径校验错误"
    - "步骤 4 搜索结果包含 inside.py"
    - "步骤 5 列出 mymath 包文件"
  edge_cases:
    - "路径遍历攻击：../../../etc/passwd 应被拦截"
    - "绝对路径 /tmp 应被拦截"
    - "workspace/ 内相对路径应正常工作"

- id: "BT-007"
  name: "命令执行与输出处理"
  description: |
    请依次执行以下命令并报告结果：
    1. python --version
    2. pip list | grep -i pytest
    3. 在 workspace/ 下运行 find . -name "*.py" -type f | head -10
    4. 运行 pytest test/test_sort.py -v
  features:
    - run_command
    - command_security
  category: basic_tools
  difficulty: medium
  expected_behavior: |
    1-3: 常规命令正常执行
    4: pytest 测试运行并输出结果
  verification:
    - "python --version 输出 Python 版本号"
    - "pip list 输出包含 pytest"
    - "find 命令返回 .py 文件列表"
    - "pytest 输出测试通过信息"
  edge_cases:
    - "长输出截断：pytest 可能产生大量输出，应正确截断保留头尾"
    - "危险命令拦截：rm -rf / 等应被拒绝"
